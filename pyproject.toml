[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openbase"
version = "1.4.12"
description = "OpenBase - 四系统（OpenLLM / OpenRAG / OpenMemory / DPS）及未来类似系统的统一基础设施公共底座框架"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OpenBase Dev Team" }]
keywords = ["fastapi", "rbac", "multi-tenant", "mcp", "observability", "framework"]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # proxy / gateway 模块的运行期依赖（此前仅声明在 dev extra，导致装配时 ImportError 被静默跳过）
    "httpx>=0.27",
    # B1: 下限提到 2.0.31（首个官方支持 Python 3.13 的版本），实测 2.1.4 通过
    "sqlalchemy[asyncio]>=2.0.31,<2.2",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-jose[cryptography]>=3.3",
    # B1: passlib 1.7.4 与 bcrypt>=5 不兼容（>72 字节探测向量直接抛错）；上限锁 4.x
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0,<5",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10",
    "fastmcp>=1.0",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[project.scripts]
openbase-cli = "openbase.cli.main:main"

[tool.setuptools.packages.find]
include = ["openbase*"]

[tool.setuptools.package-data]
openbase = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# TD-新增-009：module 级 loop 作用域，减少 Windows 上 event loop 创建/销毁
# （Proactor 多线程清理触发 access violation；配合 conftest SelectorEventLoopPolicy）
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "UP042"]
